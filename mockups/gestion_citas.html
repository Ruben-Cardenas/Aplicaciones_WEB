<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - Constructora Canese</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Logo Constructora Canese" class="logo">
        <h2>Registro de Citas</h2>
        <table>
            <tr>
                <th>Estado</th>
                <th>Fecha de Cita</th>
                <th>Número de Cita</th>
                <th>Número de Cliente</th>
            </tr>
            <tr>
                <td>Vigente</td>
                <td>2024-10-05</td>
                <td>001</td>
                <td>1001</td>
            </tr>
            <tr>
                <td>Fuera de Fecha</td>
                <td>2024-09-20</td>
                <td>002</td>
                <td>1002</td>
            </tr>
        </table>
        <div class="btn-group">
            <button class="btn">Agregar</button>
            <button class="btn">Actualizar</button>
            <button class="btn">Eliminar</button>
        </div>
    </div>
</body>
</html>
